[project]
name = "wuji-backend"
version = "1.0.0"
description = "唔叽 · 家庭收纳工具后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncmy>=0.2.9",
    "httpx>=0.27",
    "boto3>=1.34",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "alembic>=1.20",
    "cryptography>=43",
    "pillow>=12",
    "redis>=8",
    "prometheus-client>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.0", "aiosqlite>=0.20"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "unit: 不依赖外部服务的单元测试",
    "integration: 需要显式测试数据库/依赖的集成测试",
]
