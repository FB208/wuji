services:
  wuji:
    image: ${WUJI_IMAGE:?请提供本次发布镜像或加载 release.env}
    ports:
      - "${HTTP_PORT:-8000}:8000"
    env_file:
      - .env
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - mynet
networks:
  mynet:
    # 由其他项目或 docker network create mynet 提前创建，本项目只加入不管理
    external: true
    name: mynet
